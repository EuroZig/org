name: Build statutes

on:
  push:
    branches: [main]
    tags: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The macOS brand faces cannot be installed here; these are the libre
      # stand-ins that build.sh selects via --input fonts=libre.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-roboto-slab fonts-liberation

      # Pinned so the rendered output stays reproducible across runs.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.0'

      # build.sh stamps each PDF with the commit hash it was built from.
      - name: Build PDFs
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: statutes-pdf
          path: |
            de/satzung.pdf
            en/bylaws.pdf
            de/beitragsordnung.pdf
            en/membership-fee-regulations.pdf
          if-no-files-found: error

  # On a tag push, attach the built PDFs to a GitHub release. Kept as a separate
  # job so only this one needs write access to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: statutes-pdf
          path: pdf

      # Version the filenames, so a PDF downloaded on its own is still
      # identifiable without opening it.
      - name: Name assets after the tag
        run: |
          ls -R pdf
          cp pdf/de/satzung.pdf "EuroZig-Satzung-$GITHUB_REF_NAME.pdf"
          cp pdf/en/bylaws.pdf "EuroZig-Bylaws-$GITHUB_REF_NAME.pdf"
          cp pdf/de/beitragsordnung.pdf "EuroZig-Beitragsordnung-$GITHUB_REF_NAME.pdf"
          cp pdf/en/membership-fee-regulations.pdf \
            "EuroZig-Membership-Fee-Regulations-$GITHUB_REF_NAME.pdf"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "EuroZig-Satzung-$GITHUB_REF_NAME.pdf" \
            "EuroZig-Bylaws-$GITHUB_REF_NAME.pdf" \
            "EuroZig-Beitragsordnung-$GITHUB_REF_NAME.pdf" \
            "EuroZig-Membership-Fee-Regulations-$GITHUB_REF_NAME.pdf" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
