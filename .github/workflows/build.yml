name: Build statutes

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The macOS brand faces cannot be installed here; these are the libre
      # stand-ins that build.sh selects via --input fonts=libre.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-roboto-slab fonts-liberation

      # Pinned so the rendered output stays reproducible across runs.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.0'

      # build.sh stamps each PDF with the commit hash it was built from.
      - name: Build PDFs
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: statutes-pdf
          path: |
            de/satzung.pdf
            en/bylaws.pdf
          if-no-files-found: error
